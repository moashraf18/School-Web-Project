<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Tasks by Priority</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/js/search_tasks.js"></script>
</head>
<body class="tasks-page">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div id="sidebar" class="sidebar">
        <a href="{% url 'index' %}">Home</a>
        <a href="{% url 'teacher_dashboard' %}">Teacher dashboard</a>
        <a href="{% url 'view_available_tasks' %}">View Available Tasks</a>
        <a href="{% url 'view_details' %}">View Tasks Details</a>
        <a href="{% url 'view_completed_tasks' %}">View Completed Tasks</a>
        <a href="{% url 'mark_task_completed' %}">Mark Task as Completed</a>
        <a href="{% url 'logout' %}">Log out</a>
    </div>
    {% if user.is_authenticated %}
        <h1>Search Tasks By Priority</h1>
        <form id="search-tasks-form" onsubmit="return false;">
            <label for="priority">Choose Priority:</label>
            <select name="priority" id="priority">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <button type="submit" class="search-btn">Search</button>
        </form>
        <ul class="search-results"></ul>
    {% else %}
        <h1>You should Login or Sign-Up First!!</h1>
        <button type="submit" class="search-btn">
            <a href="{% url 'login' %}">Login</a>
        </button>
        <button type="submit" class="search-btn">
            <a href="{% url 'signup' %}"> Sign-Up</a>
        </button>
    {% endif %}   
</body>
</html>
