{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <div class="navbar">
        <ul>
            <li><a href="{% url 'index' %}">Home</a></li>
            <li><a href="{% url 'signup' %}">Sign up</a></li>
            <li><a href="{% url 'login' %}">Log in</a></li>
            <li><a href="{% url 'forgot_password' %}">Forgot password</a></li>
            <li><a href="{% url 'logout' %}">Log out</a></li>
        </ul>
    </div>

    <div class="login-content">
        <h1 style="text-align: center;">Login</h1>
        <form method="POST" id="signup-form">
            {% csrf_token %}
            <label for="login-username">Username:</label>
            <input type="text" id="login-username" name="login-username" required><br>

            <label for="login-password">Password:</label>
            <input type="password" id="login-password" name="login-password" required><br>

            <button type="submit">Login</button>
            
            <p><a href="{% url 'forgot_password' %}">Forgot password?</a></p>
        </form>

        {% if messages %}
            <div class="messages">
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
    </div>

    <script src="{% static 'js/Login.js' %}"></script>
</body>
</html>
